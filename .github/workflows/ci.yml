name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.18.1
          cache: npm
      - name: Install exact development graph
        run: npm ci --ignore-scripts
      - name: Verify source, publication safety, security, lifecycle, and installed package
        run: npm run verify
      - name: Build validated npm artifact
        run: |
          mkdir -p "$RUNNER_TEMP/inframux-package"
          npm pack --pack-destination "$RUNNER_TEMP/inframux-package"
          npm run package:dry-run
      - name: Upload validated npm tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: inframux-npm-${{ github.sha }}
          path: ${{ runner.temp }}/inframux-package/*.tgz
          if-no-files-found: error
          retention-days: 14
          archive: false
